name: Main

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    # if: github.repository_owner == 'foo'
    uses: adya/pack-skse-mod/.github/workflows/pack.yml@main
    with:
      CMAKE_SE_CONFIG_PRESET: ''
      CMAKE_AE_CONFIG_PRESET: 'release'
      CMAKE_VR_CONFIG_PRESET: ''

      CMAKE_BINARY_NAME: "WeatherBehavior"
      CMAKE_BINARY_VERSION: "1.0.0"
      CMAKE_AE_BINARY_DIR: 'build/release'

      FOMOD_MOD_NAME: "Seasonal Clothing Framework"
      FOMOD_MOD_AUTHOR: "Bottle"
      FOMOD_INCLUDE_PDB: true

  package:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run.outputs.AE_ARTIFACT_NAME }}
          path: artifact
      - name: Build MO2-style zip
        run: |
          mkdir -p "Seasonal Clothing Framework/SKSE/Plugins"
          cp artifact/*.dll artifact/*.pdb "Seasonal Clothing Framework/SKSE/Plugins/"
          zip -r "Seasonal Clothing Framework.zip" "Seasonal Clothing Framework"
      - uses: actions/upload-artifact@v4
        with:
          name: Seasonal Clothing Framework
          path: Seasonal Clothing Framework.zip
